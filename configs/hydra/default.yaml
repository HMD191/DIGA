# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog
  # - override launcher: submitit_slurm
  # - override launcher: /kaggle/working/DIGA/output

# output directory, generated dynamically on each run
run:
  dir: /kaggle/working/DIGA/output/${task_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  dir: /kaggle/working/DIGA/output/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}
